<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kuis pemweb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <div class="isi-card">
            <div class="header">
                <h1 class="p1">Selamat<br>Datang</h1>
                <div class="foto-profil"></div>
            </div>

            <p class="p2">Silahkan memasukan data untuk masuk</p>

            <form>
                <div class="kotakinput">
                    <fieldset>
                        <legend>Email</legend>
                        <input type="email" placeholder="Masukan email">
                        <i class="fas fa-envelope"></i>
                    </fieldset>
                </div>

                <div class="kotakinput">
                    <fieldset>
                        <legend>Nama</legend>
                        <input type="text" placeholder="Masukan nama">
                        <i class="fas fa-user"></i>
                    </fieldset>
                </div>

                <div class="kotakinput">
                    <fieldset>
                        <legend>Password</legend>
                        <input type="password" placeholder="Masukan password">
                        <i class="fas fa-eye"></i>
                    </fieldset>
                </div>

                <div class="opsi">
                    <label class="kotakingat">
                        <input type="checkbox">
                        ingat saya
                    </label>
                    <a href="#" class="lupa-pass">Lupa Password?</a>
                </div>

                <button type="submit" class="tombol-masuk">Masuk</button>
            </form>
        </div>
    </div>

</body>
</html>
